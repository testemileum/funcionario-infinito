# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for funcionario-squad-marketing.
#
# Override files (not edited here):
#   {project-root}/_funcionario/custom/funcionario-squad-marketing.toml         (team)
#   {project-root}/_funcionario/custom/funcionario-squad-marketing.user.toml    (personal)

[workflow]

# --- Configurable below. Overrides merge per Funcionário Infinito structural rules: ---
#   scalars: override wins • arrays: append

# Steps to run before the standard activation (config load, greet).
activation_steps_prepend = []

# Steps to run after greet but before the workflow begins.
activation_steps_append = []

# Persistent facts the squad keeps in mind for the whole run.
# Each entry is a literal sentence, a `skill:`-prefixed skill, or a `file:`-prefixed
# path/glob whose contents are loaded as facts.
#
# Common opt-ins (set in team/user override TOML):
#   "file:{project-root}/marca/tom-de-voz.md"        # guia de tom da marca
#   "file:{project-root}/marca/claims-aprovados.md"  # alegacoes ja liberadas
#   "Nunca prometer resultado financeiro especifico."
persistent_facts = []

# Portao Zero: the three questions put to the creator before any execution.
# "exigir"   - default. A "no" on any of the three routes to Espelho instead of writing copy.
# "avisar"   - asks, warns on a "no", and proceeds anyway.
# "ignorar"  - skips the gate entirely. Intended only for drafts that will never be published.
#
# Leave "exigir". This gate is what separates the squad from a text generator: it stops the
# work when the product, not the copy, is the problem.
portao_zero = "exigir"

# Default narrative structure used by Enredo.
# "quatro-atos" - KI / SHO / TEN / KETSU, driven by revelation (default).
# "jornada"     - the conventional problem-and-resolution arc.
# "livre"       - Enredo picks per campaign.
estrutura_narrativa = "quatro-atos"

# Briefing structure used when the work is large enough to justify a document.
briefing_template = "assets/briefing-de-campanha.md"

# Where campaign artifacts land.
campanha_output_path = "{output_folder}/campanha"
run_folder_pattern = "campanha-{project_name}-{date}"

# Whether the Freio review is mandatory before any material is declared ready.
# Leave true.
freio_obrigatorio = true

# How strictly the Freio treats a borderline finding -- one near a limit but not at its core.
# "alto"   - a borderline finding without backing is a BLOQUEIO. For regulated niches
#            (health, finance, legal) where a claim without paperwork is a real liability.
# "padrao" - default. A borderline finding without backing is GRAVE: it is reported, the
#            backing or the label is requested, and the material still ships if the user
#            decides to.
# "baixo"  - a borderline finding is MENOR and only logged. For internal drafts, tests and
#            organic content that is not a paid claim.
#
# This lever moves the border only. Each of the Freio's five limits has a core that holds in
# all three modes: a fabricated person presented as a real client; a guarantee over a third
# party's will, a cure, or a guaranteed financial return; sexual violence or child abuse as a
# hook for an unrelated product; a counter or a vacancy that does not exist; and material
# targeted at someone in acute crisis. Everything around those cores is negotiable and the
# Freio treats it as such -- labeled dramatization, composite cases, typical-results framing,
# hard but thematically honest openings, and real deadlines all pass.
freio_rigor = "padrao"

# Extra checks the Freio applies on top of its standard list. Plain-text directives.
# Use for niche-specific legal requirements.
#
# Examples (set in team/user override TOML):
#   "Nicho de saude: nenhuma alegacao de cura ou tratamento."
#   "Nicho financeiro: incluir aviso de risco em toda peca."
#   "Nicho espiritual: nenhuma promessa de efeito sobre a vontade de terceiros."
freio_checagens_extras = []

# Executed when the squad completes the work.
on_complete = ""
